[build-system]
requires = ["setuptools>=65.5", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "curso-gastronomico-backend"
version = "0.1.0"
description = "Backend do MVP da plataforma de cursos gastronômicos"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.1,<3",
    "Flask>=3.0,<4",
    "Flask-Cors>=5.0,<7",
    "Flask-JWT-Extended>=4.6,<5",
    "Flask-Migrate>=4.0,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["build", "instance"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
